name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]

jobs:
  validate:
    if: >-
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'copilot-loop') &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'copilot-loop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
