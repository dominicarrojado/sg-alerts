name: Validate OpenCode Config & Skills

on:
  push:
    paths:
      - ".opencode/**"
      - "opencode.json"
      - "AGENTS.md"
      - "scripts/verify-opencode.mjs"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]
    paths:
      - ".opencode/**"
      - "opencode.json"
      - "AGENTS.md"
      - "scripts/verify-opencode.mjs"

jobs:
  validate-opencode:
    if: >-
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'copilot-loop') &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'copilot-loop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify OpenCode Setup
        run: node scripts/verify-opencode.mjs
